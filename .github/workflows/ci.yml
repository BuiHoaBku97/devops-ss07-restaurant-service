name: CI Restaurant Service

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: [self-hosted, quickbite, restaurant-service]
    env:
      CORE_DB_URL: jdbc:postgresql://cart-db:5432/cartdb
      CORE_DB_USERNAME: postgres
      CORE_DB_PW: postgres
      RESTAURANT_SERVICE_PORT: 8080
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant permission for gradlew
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew test

  build:
    name: Build and upload JAR
    runs-on: [self-hosted, quickbite, restaurant-service]
    needs: test
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Grant permission for gradlew
        run: chmod +x gradlew

      - name: Build JAR
        run: ./gradlew bootJar -x test

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: restaurant-service-jar
          path: build/libs/
